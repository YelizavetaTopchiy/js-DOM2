<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея картинок</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Галерея зображень</h1>
    <div class="gallery-container" id="galleryContainer"></div>
    
    <div class="buttons">
        <button id="loadMoreBtn">Завантажити ще 4 картинки</button>
        <button id="clearGalleryBtn">Очистити галерею</button>
        <button id="removeLastImageBtn">Видалити останню картинку</button>
        <button id="reverseGalleryBtn">Перевернути галерею</button>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
